[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocompute-ai"
version = "1.0.0"
description = "A High-Fidelity Energy-Economic Auditor for Large-Scale AI Training"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hongping Zhang", email = "your-email@example.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
keywords = [
    "energy efficiency",
    "carbon footprint", 
    "green AI",
    "LLM",
    "machine learning",
    "sustainability",
    "GPU monitoring",
]
dependencies = [
    "pynvml>=11.0.0",
]

[project.optional-dependencies]
hf = ["transformers>=4.20.0"]
wandb = ["wandb>=0.12.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
all = [
    "transformers>=4.20.0",
    "wandb>=0.12.0",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/hongping-zh/ecocompute-ai"
Documentation = "https://hongping-zh.github.io/ecocompute-ai/"
Repository = "https://github.com/hongping-zh/ecocompute-ai"
Issues = "https://github.com/hongping-zh/ecocompute-ai/issues"
Dataset = "https://huggingface.co/datasets/hongpingzhang/rtx5090-energy-benchmark"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
